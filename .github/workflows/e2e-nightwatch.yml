name: E2E (Nightwatch)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start application (e2e profile)
        working-directory: socialnetwork
        env:
          SPRING_PROFILES_ACTIVE: e2e
        run: |
          mvn -q -DskipTests spring-boot:run -Dspring-boot.run.profiles=e2e &
          echo $! > /tmp/app.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/login | grep -q 'Bon retour'; then
              echo "App ready"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Run Nightwatch (Chrome, Firefox, Edge headless)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_SERVER_PORT: "8081"
        run: npm run test:ci

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightwatch-screenshots
          path: e2e/screenshots/

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          fi
